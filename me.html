<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Vibes</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, #ff9a9e, #fad0c4);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    .card {
      background: rgba(255,255,255,0.9);
      padding: 24px 28px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      text-align: center;
      width: min(90%, 420px);
    }
    h1 { margin: 0 0 10px; }
    p { color: #444; }
    button {
      margin-top: 14px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      cursor: pointer;
    }
    .dot {
      width: 10px;
      height: 10px;
      background: #111;
      border-radius: 50%;
      display: inline-block;
      margin: 6px;
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Hello, Internet 👋</h1>
    <p id="msg">Click the button. Something random will happen.</p>
    <div id="dots"></div>
    <button onclick="go()">Surprise me</button>
  </div>

  <script>
    const titles = [
      "Ship It 🚀",
      "Build > Talk",
      "Chaos Mode On",
      "Random Wins",
      "Hello, World++"
    ];
    const messages = [
      "This button does nothing useful. Perfect.",
      "Productivity is optional today.",
      "If it works, don’t touch it.",
      "You clicked. The universe noticed.",
      "Minimal effort, maximum vibes."
    ];

    function go() {
      const t = titles[Math.floor(Math.random()*titles.length)];
      const m = messages[Math.floor(Math.random()*messages.length)];
      document.getElementById("title").textContent = t;
      document.getElementById("msg").textContent = m;

      const dots = document.getElementById("dots");
      dots.innerHTML = "";
      const n = Math.floor(Math.random()*12)+3;
      for (let i=0; i<n; i++) {
        const d = document.createElement("span");
        d.className = "dot";
        d.style.opacity = Math.random();
        d.style.transform = `scale(${Math.random()*1.8+0.4})`;
        dots.appendChild(d);
      }
      document.body.style.background =
        `linear-gradient(135deg, hsl(${Math.random()*360},80%,70%), hsl(${Math.random()*360},80%,80%))`;
    }
  </script>
</body>
</html>
