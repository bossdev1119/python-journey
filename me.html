<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Random Vibes</title>
  
</head>
<body>
  <div class="card">
    <h1 id="title">Hello, Internet 👋</h1>
    <p id="msg">Click the button. Something random will happen.</p>
    <div id="dots"></div>
    <button onclick="go()">Surprise me</button>
  </div>

    <script>
        function go() {
        const messages = [
            "You are awesome!",
            "Keep pushing forward!",
            "Believe in yourself!",
            "Every day is a new opportunity.",
            "Stay positive and strong!"
        ];
        const randomIndex = Math.floor(Math.random() * messages.length);
        document.getElementById("msg").innerText = messages[randomIndex];
        }
  </script>
</body>
</html>
